# Deploy AFPP to altred.xyz on every push to main, or by hand (Actions → deploy →
# Run workflow). Tests first; then the web listener is built here and sent, with
# the server code, to the box as the `deploy` user, and the API is restarted.
# One-time setup on the server and in GitHub: docs/DEPLOY.md.
# Not in here: the APK and the room relay. They change rarely and go up by hand.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TARGET: deploy@altred.xyz
  SSH_PORT: '8888'
  WEBROOT: /var/www/altred.xyz/AlpineFeministPunkParade
  API: https://altred.xyz/AlpineFeministPunkParade/afpp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test src/afpp/test/*.test.mjs
      - run: npm test
        working-directory: server/afpp

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the web listener
        run: npx vite build --base=/AlpineFeministPunkParade/ --outDir dist-afpp --emptyOutDir
        env:
          VITE_AFPP_API: ${{ env.API }}
          # empty until the room relay is installed: then the chat is IRC + TBT only
          VITE_AFPP_ROOMS: ${{ vars.AFPP_ROOMS }}

      - name: SSH key and host
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # The API path is nginx's, and the APK goes up by hand: neither is deleted here.
      # Earlier bundles stay two weeks, so a page that is still open (or an older
      # copy of index.html in someone's cache) keeps working through a deploy.
      # Bundles first, never deleted here (so the new page never names a missing one),
      # then the rest with --delete; excluded paths are left alone by --delete.
      - name: The site
        run: |
          rsync -rltz -e "ssh -p $SSH_PORT" dist-afpp/assets/ "$TARGET:$WEBROOT/assets/"
          rsync -rltz --delete --exclude /afpp/ --exclude /deriva-sonora.apk --exclude /assets/ -e "ssh -p $SSH_PORT" dist-afpp/ "$TARGET:$WEBROOT/"

      - name: Prune bundles older than two weeks
        run: ssh -p "$SSH_PORT" "$TARGET" "find '$WEBROOT/assets' -type f -mtime +14 -delete"

      - name: The server
        run: rsync -rltz --delete --exclude test/ --exclude data/ -e "ssh -p $SSH_PORT" server/afpp/ "$TARGET:/opt/afpp/"

      - name: Restart and check
        run: ssh -p "$SSH_PORT" "$TARGET" 'sudo systemctl restart afpp && sleep 2 && curl -fsS http://127.0.0.1:8790/api/health'
